<html>
    <head>
        <title>Admin - Inicio</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body>
        <!-- Contenedor principal -->
        <div id="divCatalogo">
            <div class="container mx-auto p-4">
                <h1 class="text-3xl font-bold text-purple-700 mb-4">Productos disponibles</h1>

                <!-- Filtro por categoría -->
                <div class="mb-6">
                    <label for="categoriaFiltro" class="block mb-2 text-sm font-medium text-gray-700">Filtrar por categoría:</label>
                    <select id="categoriaFiltro" onchange="filtrarPorCategoria()" class="block w-60 p-2 border border-gray-300 rounded-md shadow-sm">
                        <option value="0">Todas</option>
                        <!-- Las opciones se llenarán dinámicamente -->
                    </select>
                </div>

                <!-- Grid de productos -->
                <div id="productosContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Aquí se insertarán los productos como cards -->
                </div>
            </div>
        </div>
        <div id="divDetalle" class="">
            <div class="max-w-4xl mx-auto my-10 p-6 bg-white rounded-2xl shadow-lg">
                <div class="flex flex-col md:flex-row gap-6">

                    <!-- Imagen del producto y carga -->
                    <div class="flex-shrink-0 w-full md:w-1/2 flex flex-col items-center bg-gray-50 p-4 rounded-xl shadow-inner">
                        <div class="w-full aspect-square border-2 border-dashed border-purple-300 rounded-xl flex items-center justify-center overflow-hidden mb-4">
                            <img id="imgFoto" alt="Imagen del producto" class="max-h-full object-contain" />
                        </div>

                        <label for="inputFoto" class="cursor-pointer inline-flex items-center gap-2 bg-purple-600 hover:bg-purple-700 text-white text-sm font-medium px-4 py-2 rounded-md transition-all duration-200">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M12 12v6m0 0l-3-3m3 3l3-3m6-9h-4l-2-2H10L8 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V7a2 2 0 00-2-2z" />
                            </svg>
                            Cargar Imagen
                        </label>
                        <input type="file" id="inputFoto" class="hidden" accept="image/*" />

                        <textarea id="txtaFoto" class="hidden"></textarea>
                    </div>


                    <!-- Formulario de datos -->
                    <div class="flex flex-col justify-between w-full md:w-1/2">
                        <div>
                            <label class="text-sm text-gray-700">ID:</label>
                            <input id="txtIdProducto" type="text" class="w-full p-2 border rounded-md mb-3" readonly/>

                            <label class="text-sm text-gray-700">Nombre:</label>
                            <input id="txtNombreProducto" type="text" class="w-full p-2 border rounded-md mb-3" />

                            <label class="text-sm text-gray-700">Categoría:</label>
                            <select id="categoriaDetalle" class="w-full p-2 border rounded-md mb-3">
                                <!-- Opciones llenadas con JS -->
                            </select>

                            <label class="text-sm text-gray-700">Descripción:</label>
                            <textarea id="txtDescripcion" rows="4" class="w-full p-2 border rounded-md mb-3"></textarea>
                        </div>

                        <div class="mt-auto">
                            <label class="text-sm text-gray-700">Precio:</label>
                            <input id="txtPrecio" type="number" class="w-full p-2 border rounded-md mb-2" step="0.01" />

                            <label class="text-sm text-gray-700">Stock:</label>
                            <input id="txtStock" type="number" class="w-full p-2 border rounded-md mb-4" />

                            <label class="text-sm text-gray-700">Codigo Interno:</label>
                            <input id="txtCodigoInterno" type="text" class="w-full p-2 border rounded-md mb-4" />
                        </div>
                    </div>
                </div>

                <!-- Botones -->
                <div class="flex justify-end mt-6 gap-3">
                    <button id="btnSave" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md shadow">Guardar</button>
                    <button onclick="eliminarProducto()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-md shadow">Eliminar</button>
                    <button id="btnRegresar" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-md shadow">Regresar</button>
                </div>
            </div>
        </div>
        <script src="js/inicio.js" type="text/javascript"></script>
    </body>
</html>
