<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registro de Venta - Bionika</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
        <style>
            body {
                background: linear-gradient(to right, #ede9fe, #f5f3ff);
            }
            @keyframes fadeInUp {
                0% {
                    opacity: 0;
                    transform: translateY(30px);
                }
                100% {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .animate-fade-in-up {
                animation: fadeInUp 0.6s ease-out both;
            }

            @keyframes pulse-glow {
                0%, 100% {
                    box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.6);
                }
                50% {
                    box-shadow: 0 0 0 8px rgba(168, 85, 247, 0);
                }
            }

            .animate-glow {
                animation: pulse-glow 1.8s infinite;
            }
        </style>
    </head>
    <body class="p-6 bg-gray-50 dark:bg-zinc-900">
        <div class="max-w-6xl mx-auto mt-10 space-y-8">
            <!-- Título -->
            <div class="text-center">
                <h1 class="text-3xl font-extrabold text-black drop-shadow-sm animate-fade-in-up">
                    Registrar nueva venta
                </h1>
                <div class="w-24 h-1 bg-purple-600 mx-auto mt-1 rounded-full"></div>
            </div>

            <!-- Cliente y clave interna -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-white rounded-2xl p-6 shadow-lg ring-1 ring-purple-100 border border-purple-200 animate-fade-in-up">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Nombre del cliente</label>
                    <input id="txtCliente" type="text" placeholder="Ej. Juan Pérez"
                           class="w-full border border-purple-300 rounded-xl p-3 shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition" />
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Buscar por clave interna</label>
                    <div class="flex gap-2">
                        <input id="txtClaveInterna" type="text" placeholder="Ej. RDL-001"
                               class="flex-1 border border-purple-300 rounded-xl p-3 shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition" />
                        <button id="buscarProducto" title="Buscar producto"
                                class="bg-purple-600 hover:bg-purple-700 text-white rounded-xl p-3 shadow-md transition hover:scale-105">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M10 6a4 4 0 104 4H6m6 4v2m0 0v2m0-2h2m-2 0H8" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Formulario del producto -->
            <div id="formProducto" class="bg-white rounded-2xl shadow-md p-6 border border-purple-200 hidden animate-fade-in-up">
                <h2 class="text-xl font-bold text-purple-700 mb-4">Producto seleccionado</h2>
                <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                        <input id="txtNombreProducto" type="text" disabled
                               class="w-full bg-gray-100 border border-gray-300 rounded-xl p-2" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Precio unitario</label>
                        <input id="txtPrecio" type="text" disabled
                               class="w-full bg-gray-100 border border-gray-300 rounded-xl p-2" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Unidad</label>
                        <input id="txtUnidadProducto" type="text" disabled
                               class="w-full bg-gray-100 border border-gray-300 rounded-xl p-2" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Talla</label>
                        <select id="cmbTalla"
                                class="w-full border border-purple-300 rounded-xl p-2 focus:outline-none focus:ring-2 focus:ring-purple-500">
                            <!-- opciones dinámicas -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad</label>
                        <input id="txtCantidad" type="number" min="1"
                               class="w-full border border-purple-300 rounded-xl p-2 focus:outline-none focus:ring-2 focus:ring-purple-500" />
                    </div>
                    <div class="flex items-center mt-2 space-x-2">
                        <input type="checkbox" id="checkDescuento" class="form-checkbox text-purple-600" />
                        <label for="checkDescuento" class="text-sm">Aplicar descuento (%)</label>
                        <input type="number" id="txtDescuento" class="form-input w-20 border rounded px-2 py-1" placeholder="0" min="0" max="100" disabled />
                    </div>
                </div>
                <div class="mt-6 flex justify-end">
                    <button id="agregarVenta"
                            class="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded-xl shadow-md transition hover:scale-105">
                        Agregar a la venta
                    </button>
                </div>
            </div>

            <!-- Tabla productos -->
            <div>
                <h2 class="text-lg font-bold text-purple-700 mb-2">Productos agregados</h2>
                <div class="overflow-x-auto bg-white rounded-xl shadow-md ring-1 ring-purple-100 border border-purple-200 animate-fade-in-up">
                    <table class="min-w-full divide-y divide-purple-200">
                        <thead class="bg-purple-100 text-purple-800">
                            <tr>
                                <th class="p-3 text-sm text-left font-semibold">Producto</th>
                                <th class="p-3 text-sm text-left font-semibold">Talla</th>
                                <th class="p-3 text-sm text-left font-semibold">Cantidad</th>
                                <th class="p-3 text-sm text-left font-semibold">Unidad</th>
                                <th class="p-3 text-sm text-left font-semibold">Precio</th>
                                <th class="p-3 text-sm text-left font-semibold">Descuento</th>
                                <th class="p-3 text-sm text-left font-semibold">Total</th>
                                <th class="p-3 text-sm text-left font-semibold">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaProductos" class="bg-white divide-y divide-gray-200">
                            <!-- filas dinámicas -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Totales desglosados -->
            <div class="flex justify-end mt-6">
                <div class="bg-white border border-purple-200 rounded-xl shadow-md p-6 w-full max-w-md text-right space-y-2">
                    <div>
                        <span class="text-sm font-semibold text-gray-600">Subtotal:</span>
                        <span id="subtotalVenta" class="text-lg font-bold text-gray-800">$0.00</span>
                    </div>
                    <div>
                        <span class="text-sm font-semibold text-gray-600">Descuento:</span>
                        <span id="descuentoVenta" class="text-lg font-bold text-red-600">$0.00</span>
                    </div>
                    <div>
                        <span class="text-sm font-semibold text-gray-600">IVA (16%):</span>
                        <span id="ivaVenta" class="text-lg font-bold text-gray-800">$0.00</span>
                    </div>
                    <div>
                        <span class="text-lg font-semibold text-purple-700">Total:</span>
                        <span id="totalAcumulado" class="text-2xl font-bold text-purple-700">$0.00</span>
                    </div>
                </div>
            </div>

            <!-- Botón registrar -->
            <div class="mt-8 text-right">
                <button id="registrarVenta"
                        class="bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-700 hover:to-purple-800 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition transform hover:scale-105 animate-glow mb-5">
                    Registrar venta
                </button>
            </div>
        </div>
        <script src="venta.js" type="text/javascript"></script>
    </body>
</html>
