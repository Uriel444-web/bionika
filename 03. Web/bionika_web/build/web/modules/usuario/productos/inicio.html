<html>
    <head>
        <title>Productos - Inicio</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body>
        <!-- Contenedor principal -->
        <div id="divCatalogo" class="bg-gradient-to-br from-gray-200 via-white to-purple-400 backdrop-blur-sm">
            <div class="container mx-auto p-4">
                <h1 class="text-3xl font-bold text-purple-700 mb-4">Productos disponibles</h1>

                <!-- Filtro por categoría -->
                <div class="mb-6">
                    <label for="categoria" class="block mb-2 text-sm font-medium text-gray-700">Filtrar por categoría:</label>
                    <select id="categoria" onchange="filtrarPorCategoria()" class="block w-60 p-2 border border-gray-300 rounded-md shadow-sm">
                        <option value="0">Todas</option>
                        <!-- Las opciones se llenarán dinámicamente -->
                    </select>
                </div>

                <!-- Grid de productos -->
                <div id="productosContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Aquí se insertarán los productos como cards -->
                </div>
            </div>
        </div>
        <!-- Apartado de detalle producto -->
        <div id="divDetalle" class="flex justify-center items-center py-10 px-4 bg-gradient-to-br from-gray-200 via-white to-purple-400 backdrop-blur-sm min-h-screen">
            <div class="w-full max-w-3xl bg-white rounded-3xl shadow-2xl overflow-hidden p-8 md:flex md:gap-8 transition-all">

                <!-- Imagen del producto -->
                <div class="md:w-1/2 flex items-center justify-center mb-6 md:mb-0">
                    <img id="imagen-producto" src="" alt="Imagen del producto" class="w-full h-72 object-contain rounded-2xl border border-gray-200 shadow-lg">
                </div>

                <!-- Información del producto -->
                <div class="md:w-1/2 space-y-5 text-center md:text-left">
                    <h2 id="txtNombreProducto" class="text-3xl font-bold text-gray-800 tracking-tight">Nombre del producto</h2>
                    <p id="txtPrecio" class="text-2xl font-semibold text-purple-800">Precio: $0.00</p>
                    <p id="txtDescripcion" class="text-gray-600 leading-relaxed">Descripción del producto...</p>
                    <p id="txtStock" class="text-sm text-green-700 font-medium">Stock disponible: 0</p>

                    <!-- Botón regresar -->
                    <div class="pt-4">
                        <button id="btnRegresar" class="px-6 py-2 bg-purple-900 text-white rounded-xl shadow-md hover:bg-purple-800 transition-all duration-300">
                            Regresar
                        </button>
                    </div>
                </div>

            </div>
        </div>

        <script src="js/inicio.js" type="text/javascript"></script>
    </body>
</html>
