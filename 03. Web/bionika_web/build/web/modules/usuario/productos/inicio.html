<html>
    <head>
        <title>Productos - Inicio</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body>
        <!-- Contenedor principal -->
        <div id="divCatalogo">
            <div class="container mx-auto p-4">
                <h1 class="text-3xl font-bold text-purple-700 mb-4">Productos disponibles</h1>

                <!-- Filtro por categoría -->
                <div class="mb-6">
                    <label for="categoria" class="block mb-2 text-sm font-medium text-gray-700">Filtrar por categoría:</label>
                    <select id="categoria" onchange="filtrarPorCategoria()" class="block w-60 p-2 border border-gray-300 rounded-md shadow-sm">
                        <option value="0">Todas</option>
                        <!-- Las opciones se llenarán dinámicamente -->
                    </select>
                </div>

                <!-- Grid de productos -->
                <div id="productosContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Aquí se insertarán los productos como cards -->
                </div>
            </div>
        </div>
        <div id="divDetalle" class="flex justify-center items-center py-10 px-4">
            <div class="w-full max-w-xl bg-white rounded-2xl shadow-xl overflow-hidden p-6">

                <!-- Imagen del producto -->
                <div class="mb-6">
                    <img id="imagen-producto" src="" alt="Imagen del producto" class="w-full h-64 object-contain rounded-xl border border-gray-200 shadow-md">
                </div>

                <!-- Información del producto -->
                <div class="text-center space-y-4">
                    <h2 id="txtNombreProducto" class="text-3xl font-extrabold text-purple-700">Nombre del producto</h2>
                    <p id="txtPrecio" class="text-2xl font-semibold text-purple-600">Precio: $0.00</p>
                    <p id="txtDescripcion" class="text-gray-700">Descripción del producto...</p>
                    <p id="txtStock" class="text-sm text-green-600 font-medium">Stock disponible: 0</p>
                </div>

                <!-- Botón regresar -->
                <div class="mt-8 text-center">
                    <button id="btnRegresar" class="px-6 py-2 bg-purple-600 text-white rounded-lg shadow hover:bg-purple-700 transition-all">Regresar</button>
                </div>

            </div>
        </div>
        <script src="js/inicio.js" type="text/javascript"></script>
    </body>
</html>
