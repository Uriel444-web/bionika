<!DOCTYPE html>

<html>
    <head>
        <title>TODO supply a title</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body class="bg-gray-50">
        <div class="flex flex-col lg:flex-row min-h-screen p-4 gap-4">
            <!-- Sección Cards Usuarios -->
            <div class="flex-1 bg-white rounded-lg shadow-md border border-gray-200 p-6 overflow-y-auto">
                <!-- Título centrado con línea decorativa -->
                <div class="text-center mb-6">
                    <h2 class="text-3xl font-semibold text-gray-900">Usuarios Registrados</h2>
                    <div class="mx-auto mt-2 w-24 h-1 bg-purple-600 rounded-full"></div>
                </div>

                <div class="bg-purple-50 p-4 rounded-xl shadow-inner">
                    <!-- Fila: buscador izquierda / botón derecha -->
                    <div class="mb-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                        <!-- Buscador -->
                        <div class="relative w-full sm:w-64">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-purple-800" fill="none" stroke="currentColor" stroke-width="2"
                                     viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                      d="M21 21l-4.35-4.35M10 18a8 8 0 100-16 8 8 0 000 16z" />
                                </svg>
                            </div>
                            <input
                                type="text"
                                id="busquedaUsuario"
                                placeholder="Buscar usuario..."
                                class="w-full pl-10 pr-4 py-2 border border-purple-800 bg-purple-50 text-gray-800 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500"
                                />
                        </div>

                        <!-- Botón Agregar -->
                        <button
                            onclick="abrirFormularioAgregar()"
                            class="inline-flex items-center px-4 py-2 bg-purple-800 text-white text-sm font-medium rounded-lg shadow-sm hover:bg-purple-900 transition focus:outline-none"
                            >
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M12 4v16m8-8H4" />
                            </svg>
                            Agregar
                        </button>
                    </div>

                    <!-- Contenedor de cards -->
                    <div id="contenedorUsuarios" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                </div>
            </div>

            <!-- Sección Formulario Edición (Oculto por defecto) -->
            <div id="formularioUsuario" class="w-full lg:w-1/3 bg-white rounded-lg shadow-md border border-gray-200 p-6 overflow-y-auto hidden">
                <h2 class="text-3xl font-semibold text-center text-gray-900 mb-6">Editar Usuario</h2>

                <!-- Info básica -->
                <div class="mb-6">
                    <label class="text-gray-700 font-medium">ID:</label>
                    <div class="relative">
                        <input id="txtId" type="text" readonly
                               class="mt-1 w-full bg-gray-100 cursor-not-allowed pl-10 pr-4 py-2 border border-gray-300 rounded-xl shadow-sm focus:outline-none">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-purple-600">
                            <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4a4 4 0 110 8 4 4 0 010-8z M12 12c-4 0-8 2-8 4v2h16v-2c0-2-4-4-8-4z" />
                            </svg>
                        </span>
                    </div>
                </div>

                <!-- Nombre -->
                <div class="mb-4">
                    <label class="text-gray-700 font-medium">Nombre:</label>
                    <input id="txtNombre" type="text" placeholder="Ej. Karla"
                           class="mt-1 w-full pl-4 pr-4 py-2 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>

                <!-- Apellidos -->
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="text-gray-700 font-medium">Apellido Paterno:</label>
                        <input id="txtApellidoP" type="text" placeholder="Martinez"
                               class="mt-1 w-full pl-4 pr-4 py-2 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="text-gray-700 font-medium">Apellido Materno:</label>
                        <input id="txtApellidoM" type="text" placeholder="Lopez"
                               class="mt-1 w-full pl-4 pr-4 py-2 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                    </div>
                </div>

                <!-- Contacto -->
                <div class="mb-4">
                    <label class="text-gray-700 font-medium">Correo:</label>
                    <input id="txtCorreo" type="email" placeholder="ejemplo@mail.com"
                           class="mt-1 w-full pl-4 pr-4 py-2 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                <div class="mb-4">
                    <label class="text-gray-700 font-medium">Teléfono:</label>
                    <input id="txtTelefono" type="text" placeholder="111-111-1111"
                           class="mt-1 w-full pl-4 pr-4 py-2 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>

                <!-- Usuario / Contraseña -->
                <div class="mb-4">
                    <label class="text-gray-700 font-medium">Usuario:</label>
                    <input id="txtUsuario" type="text" placeholder="Empleado_1"
                           class="mt-1 w-full pl-4 pr-4 py-2 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
                <div class="mb-4">
                    <label class="text-gray-700 font-medium">Contraseña:</label>
                    <input id="txtContrasena" type="password" placeholder="********"
                           class="mt-1 w-full pl-4 pr-4 py-2 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>

                <!-- Rol -->
                <div class="mb-6">
                    <label class="text-gray-700 font-medium">Categoría:</label>
                    <select id="cmbCategoria" class="mt-1 w-full pl-4 pr-4 py-2 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                    </select>
                </div>

                <!-- Botones -->
                <div class="flex justify-between">
                    <button id="actualizarUs" type="button" disabled
                            class="bg-gradient-to-r from-green-600 via-green-700 to-green-800 hover:from-green-700 hover:to-green-900 text-white font-semibold px-6 py-2 rounded-full shadow-md transition duration-200">
                        Actualizar
                    </button>

                    <button id="btnE" type="button" title="Eliminar usuario"
                            class="text-red-600 hover:text-red-800">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                              d="M6 7.5V19.5A1.5 1.5 0 007.5 21h9a1.5 1.5 0 001.5-1.5V7.5m-13.5 0h15m-12 0V6A1.5 1.5 0 017.5 4.5h9A1.5 1.5 0 0118 6v1.5" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </body>

</html>
