<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Home - Bionika</title>
        <link rel="icon" href="resources/bionika-logo.png"/>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <link href="CSS/inicio.css" rel="stylesheet" type="text/css"/>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-SOME_HASH" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <style>
            body {
                font-family: 'Inter', sans-serif;
            }
        </style>
    </head>

    <body class="bg-gray-100 min-h-screen flex flex-col dark:bg-zinc-800">

        <!-- Pantalla de carga -->
        <div id="splash" class="fixed inset-0 flex items-center justify-center bg-white z-50">
            <img src="resources/bionika-logo.png" alt="Logo Bionika" class="w-40 h-40 animate-pulse">
        </div>

        <div class="login-hover-trigger hidden fixed top-0 left-0 w-full h-10 z-20 "></div>

        <!-- Navbar -->
        <nav id="navbar" class="bg-white/80 backdrop-blur-md shadow-lg fixed w-full h-20 z-30 top-0 left-0 transition-opacity duration-300 dark:bg-zinc-900/80">
            <div class="max-w-6xl mx-auto px-4 h-full">
                <div class="flex justify-between items-center h-20">

                    <!-- Logo -->
                    <div class="h-full flex items-center">
                        <img class="h-10 sm:h-12 md:h-14 w-auto transition-all duration-300 dark:hidden" src="resources/logotipo_Bionika_Texto.png" alt="Logo Bionika">
                        <img class="h-10 sm:h-12 md:h-14 w-auto transition-all duration-300 hidden dark:block" src="resources/logo_blanco.png" alt="Logo Bionika">
                    </div>

                    <!-- Menú -->
                    <div class="hidden md:flex items-center space-x-6">
                        <a id="btnHome" href="#" class="nav-link text-gray-900 font-semibold hover:text-purple-900 hover:border-b-2 hover:border-purple-700 transition dark:text-white dark:hover:text-purple-400">Home</a>
                        <a id="btnProductos" href="#" class="nav-link text-gray-900 font-semibold hover:text-purple-900 hover:border-b-2 hover:border-purple-700 transition dark:text-white dark:hover:text-purple-400">Productos</a>
                        <a id="btnSucursal" href="#" class="nav-link text-gray-900 font-semibold hover:text-purple-900 hover:border-b-2 hover:border-purple-700 transition dark:text-white dark:hover:text-purple-400">Sucursales</a>
                        <a id="btnUsuario" href="#" class="hidden nav-link text-gray-900 font-semibold hover:text-purple-900 hover:border-b-2 hover:border-purple-700 transition dark:text-white dark:hover:text-purple-400">Usuarios</a>

                        <!-- Iniciar Sesión y Cerrar Sesión -->
                        <div class="px-2 border-x-2 border-gray-100 dark:border-zinc-700 flex items-center gap-2">
                            <a id="btnLogin" href="#" class="text-purple-700 font-bold px-3 py-1 rounded-md bg-purple-100/60 ring-2 ring-purple-300 shadow-sm hover:bg-purple-200 transition dark:text-purple-400 dark:bg-zinc-800 dark:ring-purple-700 dark:hover:bg-purple-900">
                                Iniciar Sesión
                            </a>
                            <button id="btnCerrarSesion" class="hidden flex items-center gap-2 bg-gradient-to-r from-red-500 via-red-600 to-red-700 hover:from-red-600 hover:via-red-700 hover:to-red-800 text-white font-bold py-2 px-4 rounded-full shadow-md hover:shadow-lg transition-all duration-200 ease-in-out" title="Cerrar Sesión">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1" />
                                </svg>
                            </button>
                        </div>

                        <!-- Dark mode -->
                        <button id="toggleDark" class="p-2 rounded-lg focus:outline-none">
                            <!-- Sol -->
                            <svg class="w-6 h-6 text-yellow-500 hover:text-yellow-700 hover:bg-yellow-100 rounded-full transition-colors dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                            </svg>
                            <!-- Luna -->
                            <svg class="w-6 h-6 text-blue-400 hover:text-blue-700 hover:bg-blue-200 rounded-full transition-colors hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                            </svg>
                        </button>
                    </div>

                    <!-- Hamburguesa -->
                    <div class="md:hidden flex items-center ml-2">
                        <button id="menu-btn" class="text-purple-700 focus:outline-none">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M4 6h16M4 12h16M4 18h16" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Menú móvil -->
            <div id="menu" class="hidden md:hidden flex flex-col bg-white shadow-md dark:bg-zinc-900">
                <a href="#productos" class="block px-4 py-2 text-gray-700 hover:font-bold hover:bg-gray-200 dark:text-white dark:hover:text-purple-900">Productos</a>
                <a id="btnLoginMovil" href="#" class="block px-4 py-2 text-purple-700 font-semibold hover:bg-purple-100 dark:text-purple-400 dark:hover:bg-zinc-700">Iniciar Sesión</a>
                <a id="btnCerrarSesionMovil" href="#" class="hidden block px-4 py-2 text-red-600 font-semibold hover:bg-red-100 dark:text-red-400 dark:hover:bg-zinc-700">
                    Cerrar Sesión
                </a>
            </div>
        </nav>

        <!-- Espacio para el navbar -->
        <div class="h-20"></div>

        <!-- AQUI SE IRA CARGANDO EL CONTENIDO SELECCIONADO -->
        <div id="content"></div>

        <!-- Footer -->
        <footer id="foter" class="bg-zinc-800 text-white py-3 mt-auto">
            <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between space-y-4 md:space-y-0">
                <!-- Logo -->
                <div class="flex items-center space-x-2">
                    <span class="text-lg font-semibold">Bionika</span>
                </div>

                <!-- Texto -->
                <p class="text-sm text-center md:text-left">© 2025 Bionika. Todos los derechos reservados.</p>

                <div class="flex items-center space-x-2">
                    <!-- Facebook -->
                    <a href="https://www.facebook.com/Ortobionika/" target="_blank" rel="noopener noreferrer" class="hover:opacity-80 transition">
                        <img src="resources/facebookIcon.png" alt="Facebook" class="w-8 h-8">
                    </a>

                    <!-- twitter -->
                    <a href="https://wa.me/524776971513" target="_blank" rel="noopener noreferrer" class="hover:opacity-80 transition">
                        <img src="resources/twitterIcon.png" alt="Twitter" class="w-8 h-8">
                    </a>

                    <!-- WhatsApp -->
                    <a href="https://wa.me/524776971513" target="_blank" rel="noopener noreferrer" class="hover:opacity-80 transition">
                        <img src="resources/whatsAppIcon.png" alt="WhatsApp" class="w-8 h-8">
                    </a>

                </div>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
        <script src="JS/index.js" type="text/javascript"></script>
    </body>
</html>
