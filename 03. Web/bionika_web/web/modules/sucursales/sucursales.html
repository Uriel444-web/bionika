<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sucursales - Ubicaciones</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
        <style>
            html, body {
                margin: 0;
                padding: 0;
                height: 100%;
            }
        </style>
    </head>
    <body class="bg-gray-50 text-gray-900 dark:bg-zinc-900 dark:text-white">

        <section class="w-full py-16 bg-gradient-to-br from-purple-100 via-white to-purple-200 mt-10">
            <h1 class="text-4xl font-extrabold text-center text-black mb-2 drop-shadow-md flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 11c1.104 0 2-.896 2-2s-.896-2-2-2-2 .896-2 2 .896 2 2 2zm0 0c2.21 0 4 1.79 4 4H8c0-2.21 1.79-4 4-4zm0 10s6-4.33 6-10a6 6 0 10-12 0c0 5.67 6 10 6 10z" />
                </svg>
                Nuestras Sucursales
            </h1>

            <p class="text-center text-gray-600 mb-8 text-lg">
                Encuentra tu sucursal más cercana y visítanos con confianza
            </p>

            <!-- CONTENEDOR FLEX HORIZONTAL -->
            <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-6 px-4 p-4">
                <!-- LISTA DE SUCURSALES -->
                <div id="listaSucursales" class="h-[500px] overflow-y-auto pr-2 space-y-4">
                    <!-- Aquí se inyectarán las cards de sucursales -->
                </div>

                <!-- MAPA -->
                <div class="w-full lg:w-2/3">
                    <div class="bg-white border-4 border-purple-200 rounded-3xl shadow-xl p-4">
                        <div id="mapaSucursales" class="w-full h-[500px] rounded-2xl"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Sección de sucursales existendes en la base de datos (solo visible para admin) -->
        <section id="seccionSucursales" class="hidden bg-white dark:bg-zinc-800 py-12 px-6 shadow-inner">
            <h2 class="text-3xl font-semibold text-center mb-8 underline underline-offset-8 decoration-purple-600">
                Sucursales Registradas
            </h2>

            <div id="sucursales" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-10 px-4">
                <!-- Aquí se cargarán dinámicamente las sucursales -->
            </div>

            <div class="flex flex-col md:flex-row justify-center items-center gap-6">
                <button id="registrarS"
                        class="bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white font-semibold py-3 px-7 rounded-lg shadow-md hover:shadow-lg transition-all duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-green-500">
                    Agregar sucursal
                </button>

                <button id="btnReporteVentas"
                        class="bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-700 hover:to-purple-800 text-white font-semibold py-3 px-7 rounded-lg shadow-md hover:shadow-lg transition-all duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-purple-500">
                    Reportes
                </button>
            </div>

        </section>

        <section id="FormularioRegistro" class="hidden">
            <div class="max-w-5xl mx-auto p-6 md:p-10 mt-10 bg-white dark:bg-zinc-900 rounded-2xl shadow-lg shadow-violet-400/30">
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-bold text-gray-900 dark:text-white">Registro de Nueva Sucursal</h2>
                    <div class="mx-auto mt-2 w-24 h-1 bg-purple-500 rounded-full"></div>
                </div>

                <form class="space-y-6">
                    <h3 class="text-xl text-gray-700 dark:text-gray-300 font-semibold text-center">Datos de la Sucursal</h3>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="txtIdSucursal" class="block text-sm font-medium text-gray-700 dark:text-gray-400">ID</label>
                            <input id="txtIdSucursal" type="text" placeholder="0000" readonly
                                   class="mt-1 w-full bg-gray-100 cursor-not-allowed dark:bg-zinc-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-zinc-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" />
                        </div>

                        <div>
                            <label for="txtNombreSuc" class="block text-sm font-medium text-gray-700 dark:text-gray-400">Nombre de sucursal</label>
                            <input id="txtNombreSuc" type="text" placeholder="Ej. Suc - Central"
                                   class="mt-1 w-full bg-white dark:bg-zinc-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-zinc-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" required />
                        </div>

                        <div>
                            <label for="txtNumExt" class="block text-sm font-medium text-gray-700 dark:text-gray-400">Número exterior</label>
                            <input id="txtNumExt" type="text" placeholder="#000"
                                   class="mt-1 w-full bg-white dark:bg-zinc-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-zinc-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" required />
                        </div>

                        <div>
                            <label for="txtTelefono" class="block text-sm font-medium text-gray-700 dark:text-gray-400">Teléfono</label>
                            <input id="txtTelefono" type="text" placeholder="Ej. 477-123-1234"
                                   class="mt-1 w-full bg-white dark:bg-zinc-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-zinc-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" required />
                        </div>

                        <div>
                            <label for="txtLatitud" class="block text-sm font-medium text-gray-700 dark:text-gray-400">Latitud</label>
                            <input id="txtLatitud" type="text" placeholder="Ej. 100.0000"
                                   class="mt-1 w-full bg-white dark:bg-zinc-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-zinc-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" required />
                        </div>

                        <div>
                            <label for="txtLongitud" class="block text-sm font-medium text-gray-700 dark:text-gray-400">Longitud</label>
                            <input id="txtLongitud" type="text" placeholder="Ej. -100.0000"
                                   class="mt-1 w-full bg-white dark:bg-zinc-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-zinc-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" required />
                        </div>

                        <div>
                            <label for="txtCodPos" class="block text-sm font-medium text-gray-700 dark:text-gray-400">Código Postal</label>
                            <input id="txtCodPos" type="text" placeholder="Ej. 37299"
                                   class="mt-1 w-full bg-white dark:bg-zinc-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-zinc-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" required />
                        </div>

                        <div>
                            <label for="txtColonia" class="block text-sm font-medium text-gray-700 dark:text-gray-400">Colonia</label>
                            <input id="txtColonia" type="text" placeholder="Ej. Obregon"
                                   class="mt-1 w-full bg-white dark:bg-zinc-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-zinc-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" required />
                        </div>

                        <div class="md:col-span-2">
                            <label for="txtCalle" class="block text-sm font-medium text-gray-700 dark:text-gray-400">Calle</label>
                            <input id="txtCalle" type="text" placeholder="Ej. Gaviotas"
                                   class="mt-1 w-full bg-white dark:bg-zinc-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-zinc-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" required />
                        </div>
                    </div>

                    <div class="flex justify-center mt-8 gap-4">

                        <button id="btnRegresar" type="button"
                                class="bg-gradient-to-r from-gray-300 via-gray-400 to-gray-500 hover:from-gray-400 hover:to-gray-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md flex items-center gap-2 transition-all duration-200">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"
                                 stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                            </svg>
                            Regresar
                        </button>

                        <button id="registrarSucursal" type="button"
                                class="bg-gradient-to-r from-purple-400 via-purple-600 to-purple-700 hover:from-purple-500 hover:to-purple-800 text-white font-semibold py-3 px-6 rounded-lg shadow-md flex items-center gap-2 transition-all duration-200">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"
                                 stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                            </svg>
                            Guardar sucursal
                        </button>
                    </div>
                </form>
            </div> 
        </section>

        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    </body>
</html>
