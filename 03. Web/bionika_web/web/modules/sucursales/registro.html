<!DOCTYPE html>

<html>
    <head>
        <title>TODO supply a title</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body class="bg-gray-100 dark:bg-zinc-800">
        <div class="max-w-5xl mx-auto p-6 md:p-10 mt-10 bg-white dark:bg-zinc-900 rounded-2xl shadow-lg shadow-violet-400/30">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-gray-900 dark:text-white">Registro de Nueva Sucursal</h2>
                <div class="mx-auto mt-2 w-24 h-1 bg-purple-500 rounded-full"></div>
            </div>

            <form class="space-y-6">
                <h3 class="text-xl text-gray-700 dark:text-gray-300 font-semibold text-center">Datos de la Sucursal</h3>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="txtIdSucursal" class="block text-sm font-medium text-gray-700 dark:text-gray-400">ID</label>
                        <input id="txtIdSucursal" type="text" placeholder="0000" readonly
                               class="mt-1 w-full bg-gray-100 cursor-not-allowed dark:bg-zinc-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-zinc-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" />
                    </div>

                    <div>
                        <label for="txtNombreSuc" class="block text-sm font-medium text-gray-700 dark:text-gray-400">Nombre de sucursal</label>
                        <input id="txtNombreSuc" type="text" placeholder="Ej. Suc - Central"
                               class="mt-1 w-full bg-white dark:bg-zinc-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-zinc-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" required />
                    </div>

                    <div>
                        <label for="txtNumExt" class="block text-sm font-medium text-gray-700 dark:text-gray-400">Número exterior</label>
                        <input id="txtNumExt" type="text" placeholder="#000"
                               class="mt-1 w-full bg-white dark:bg-zinc-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-zinc-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" required />
                    </div>

                    <div>
                        <label for="txtTelefono" class="block text-sm font-medium text-gray-700 dark:text-gray-400">Teléfono</label>
                        <input id="txtTelefono" type="text" placeholder="Ej. 477-123-1234"
                               class="mt-1 w-full bg-white dark:bg-zinc-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-zinc-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" required />
                    </div>

                    <div>
                        <label for="txtLatitud" class="block text-sm font-medium text-gray-700 dark:text-gray-400">Latitud</label>
                        <input id="txtLatitud" type="text" placeholder="Ej. 100.0000"
                               class="mt-1 w-full bg-white dark:bg-zinc-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-zinc-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" required />
                    </div>

                    <div>
                        <label for="txtLongitud" class="block text-sm font-medium text-gray-700 dark:text-gray-400">Longitud</label>
                        <input id="txtLongitud" type="text" placeholder="Ej. -100.0000"
                               class="mt-1 w-full bg-white dark:bg-zinc-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-zinc-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" required />
                    </div>

                    <div>
                        <label for="txtCodPos" class="block text-sm font-medium text-gray-700 dark:text-gray-400">Código Postal</label>
                        <input id="txtCodPos" type="text" placeholder="Ej. 37299"
                               class="mt-1 w-full bg-white dark:bg-zinc-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-zinc-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" required />
                    </div>

                    <div>
                        <label for="txtColonia" class="block text-sm font-medium text-gray-700 dark:text-gray-400">Colonia</label>
                        <input id="txtColonia" type="text" placeholder="Ej. Obregon"
                               class="mt-1 w-full bg-white dark:bg-zinc-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-zinc-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" required />
                    </div>

                    <div class="md:col-span-2">
                        <label for="txtCalle" class="block text-sm font-medium text-gray-700 dark:text-gray-400">Calle</label>
                        <input id="txtCalle" type="text" placeholder="Ej. Gaviotas"
                               class="mt-1 w-full bg-white dark:bg-zinc-800 text-gray-700 dark:text-gray-300 border border-gray-300 dark:border-zinc-700 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500 transition" required />
                    </div>
                </div>

                <div class="flex justify-center mt-8">
                    <button id="registrarSucursal" type="button"
                            class="bg-gradient-to-r from-purple-400 via-purple-600 to-purple-700 hover:from-purple-500 hover:to-purple-800 text-white font-semibold py-3 px-6 rounded-lg shadow-md flex items-center gap-2 transition-all duration-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"
                             stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        Guardar sucursal
                    </button>
                </div>
            </form>
        </div>
    </body>
</html>
