<html>
    <head>
        <title>Productos - Inicio</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body>
        <!-- Contenedor principal -->
        <div id="divCatalogo">
            <div class="container mx-auto p-4">
                <h1 class="text-3xl font-bold text-purple-700 mb-4">Productos disponibles</h1>

                <!-- Filtro por categoría -->
                <div class="mb-6">
                    <label for="categoria" class="block mb-2 text-sm font-medium text-gray-700">Filtrar por categoría:</label>
                    <select id="categoria" onchange="filtrarPorCategoria()" class="block w-60 p-2 border border-gray-300 rounded-md shadow-sm">
                        <option value="0">Todas</option>
                        <!-- Las opciones se llenarán dinámicamente -->
                    </select>
                </div>

                <!-- Grid de productos -->
                <div id="productosContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Aquí se insertarán los productos como cards -->
                </div>
            </div>
        </div>
        <div id="divDetalle">
            <!-- Contenedor general -->
            <div class="max-w-4xl mx-auto my-10 p-6 bg-white rounded-2xl shadow-lg">
                <div class="flex flex-col md:flex-row gap-6">

                    <!-- Imagen del producto -->
                    <div class="flex-shrink-0 w-full md:w-1/2">
                        <img id="imagen-producto" src="" alt="Imagen del producto" class="w-full h-auto rounded-xl shadow-md object-contain">
                    </div>

                    <!-- Información del producto -->
                    <div class="flex flex-col justify-between w-full md:w-1/2">
                        <div>
                            <h2 id="txtNombreProducto" class="text-2xl font-bold text-purple-700 mb-2">Nombre del producto</h2>
                            <p id="txtCategoria" class="text-sm text-gray-500 mb-4">Categoría: Nombre de categoría</p>
                            <p id="txtDescripcion" class="text-gray-700 mb-6">Descripción del producto...</p>
                        </div>

                        <div class="mt-auto">
                            <p id="txtPrecio" class="text-xl font-semibold text-purple-600">Precio: $0.00</p>
                            <p id="txtStock" class="text-sm text-green-600 mt-2">Stock disponible: 0</p>
                        </div>
                    </div>
                </div>
                <button id="btnRegresar">Regresar</button>
            </div>
        </div>
        <script src="js/inicio.js" type="text/javascript"></script>
    </body>
</html>
