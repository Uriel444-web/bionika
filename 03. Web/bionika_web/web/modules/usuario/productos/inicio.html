<html>
    <head>
        <title>Productos - Inicio</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body>
        <!-- Contenedor principal -->
        <div id="divCatalogo" class="bg-gradient-to-br from-gray-200 via-white to-purple-400 backdrop-blur-sm">
            <div class="container mx-auto p-4">
                <h1 class="text-2xl sm:text-3xl font-bold text-purple-700 mb-6 text-center relative inline-block
                    after:content-[''] after:block after:h-1 after:w-16 after:mx-auto after:bg-purple-300 after:rounded-full after:mt-2
                    drop-shadow-sm"
                    style="text-shadow:
                    0 0 6px rgba(167, 139, 250, 0.5),
                    0 0 12px rgba(167, 139, 250, 0.3);">
                    Productos disponibles
                </h1>

                <div class="mb-8 flex flex-col md:flex-row md:items-end md:justify-between gap-4">
                    <!-- Filtro por categoría + ícono venta -->
                    <div>
                        <label for="categoria" class="block mb-2 text-sm font-semibold text-gray-800 dark:text-white">
                            Filtrar por categoría:
                        </label>
                        <div class="flex items-center space-x-3">
                            <select id="categoria"
                                    onchange="filtrarPorCategoria()"
                                    class="w-60 px-4 py-2 border border-purple-300 rounded-md shadow-sm ring-1 ring-purple-200 focus:outline-none focus:ring-2 focus:ring-purple-500 dark:bg-zinc-800 dark:text-white transition">
                                <option value="0">Todas</option>
                            </select>

                            <!-- Ícono venta -->
                            <div id="iconoRegistrarVenta"
                                 class="hidden cursor-pointer text-purple-600 hover:text-purple-800 transition duration-200"
                                 title="Registrar venta">
                                <svg xmlns="http://www.w3.org/2000/svg"
                                     class="w-7 h-7"
                                     fill="none"
                                     viewBox="0 0 24 24"
                                     stroke="currentColor"
                                     stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                      d="M3 3h2l.4 2M7 13h14l-1.35 6.75a1 1 0 0 1-.98.75H7a1 1 0 0 1-1-1V6H3" />
                                <circle cx="9" cy="21" r="1" />
                                <circle cx="20" cy="21" r="1" />
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Buscador -->
                    <div class="flex items-center space-x-2">
                        <div class="flex items-center bg-white border-2 border-purple-400 rounded-full px-3 py-[6px] shadow-sm focus-within:ring-2 focus-within:ring-purple-500 transition dark:bg-zinc-800">
                            <svg class="w-4 h-4 text-purple-500 mr-2" fill="none" stroke="currentColor" stroke-width="2"
                                 viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M21 21l-6-6m0 0A7 7 0 1011 4a7 7 0 004 13z" />
                            </svg>
                            <input id="txtBuscar" 
                                   type="text" 
                                   placeholder="Buscar productos..."
                                   oninput="buscarProductoPorTexto()"
                                   class="w-full bg-transparent text-sm focus:outline-none dark:text-white placeholder:text-sm" />
                        </div>
                    </div>
                </div>

                <!-- Grid de productos -->
                <div id="productosContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Aquí se insertarán los productos como cards -->
                </div>
            </div>
        </div>
        <script src="js/inicio.js" type="text/javascript"></script>
    </body>
</html>
