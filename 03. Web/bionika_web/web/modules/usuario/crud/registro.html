<!DOCTYPE html>

<html>
    <head>
        <title>Registro - usuarios</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body>

        <div class=" pb-8 pt-6 px-8 rounded-lg bg-white shadow-md shadow-violet-500/50 h-auto mx-56 mt-6 dark:bg-zinc-900">

            <div class=" mx-auto mb-3 shadow-md border-2 border-violet-300 rounded-full w-2/3">
                <h2 class="text-4xl mt-3 font-semibold text-center text-gray-900 mb-3 dark:text-white">Registro de Nuevo Usuario </h2>
            </div>
            <form>   

                <h2 class="text-gray-700 text-xl text-center leading-relaxed dark:text-gray-400">Datos personales</h2>

                <div class="grid grid-cols-2 border-t-2 border-violet-300 py-4">
                    
                     <div class="px-4 ">
                        <label class="mt-4 text-gray-700 text-lg leading-relaxed m-5 dark:text-gray-400">ID: </label> 
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 pb-4 flex items-center pointer-events-none">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 20h14M12 4a4 4 0 110 8 4 4 0 010-8zm0 8c-4 0-8 2-8 4v2h16v-2c0-2-4-4-8-4z" />
                                </svg>
                            </span>
                            <input id="txtId" type="text" placeholder="0000"
                                   class=" bg-gray-100 cursor-not-allowed mb-4 w-1/2 pl-10 pr-4 py-3 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200" required readonly="true">
                        </div>
                     </div>
                    <div class="px-4 ">

                        <label class="mt-4 text-gray-700 text-lg leading-relaxed m-5 dark:text-gray-400">Nombre: </label> 
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 pb-4 flex items-center pointer-events-none">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 20h14M12 4a4 4 0 110 8 4 4 0 010-8zm0 8c-4 0-8 2-8 4v2h16v-2c0-2-4-4-8-4z" />
                                </svg>
                            </span>
                            <input id="txtNombre" type="text" placeholder="Ej. Karla Lizbeth"
                                   class="  mb-4 w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200" required>
                        </div>
                    </div>

                    <div class="px-4">
                        <label class="text-gray-700 text-lg leading-relaxed m-5 dark:text-gray-400">Apellido paterno: </label> 
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 pb-4 flex items-center pointer-events-none">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-purple-600" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 2a5 5 0 00-5 5v2a5 5 0 0010 0V7a5 5 0 00-5-5zm-4 9a4 4 0 118 0 4 4 0 01-8 0zm-2 7a4 4 0 014-4h4a4 4 0 014 4v3H6v-3z"/>
                                </svg>
                            </span>
                            <input id="txtApellidoP" type="text" placeholder="Ej. Martinez"
                                   class="mb-4 w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200" required>
                        </div>
                    </div>
                    
                    <div class="px-4">
                        <label class="text-gray-700 text-lg leading-relaxed m-5 dark:text-gray-400">Apellido Materno: </label>     
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 pb-4 flex items-center pointer-events-none">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-purple-600" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 2a5 5 0 100 10 5 5 0 000-10zm1 11.93a7 7 0 00-2 0V17H8v2h3v3h2v-3h3v-2h-3v-3.07z"/>
                                </svg>
                            </span>
                            <input id="txtApellidoM" type="text" placeholder="Ej. Lopez"
                                   class="mb-4 w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200" required>

                        </div>
                    </div>
                    <div class="px-4">
                        <label class="text-gray-700 text-lg leading-relaxed m-5 dark:text-gray-400">Correo: </label> 
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 pb-4 flex items-center pointer-events-none">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 11-4-4m0 0a4 4 0 014 4v1a1 1 0 001 1h1a8 8 0 10-2.93 6.07" />
                                </svg>
                            </span>
                            <input id="txtCorreo" type="text" placeholder="Ej. ejemplo123@gmail.com"
                                   class="mb-4 w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200" required>
                        </div>
                    </div>
                    <div class="px-4">
                        <label class="text-gray-700 text-lg leading-relaxed m-5 dark:text-gray-400">Telefono: </label> 
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 pb-4 flex items-center pointer-events-none">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h2a2 2 0 012 2v2a1 1 0 01-.293.707l-1 1a16.016 16.016 0 006.586 6.586l1-1A1 1 0 0115 14h2a2 2 0 012 2v2a2 2 0 01-2 2A17 17 0 013 5z" />
                                </svg>
                            </span>
                            <input id="txtTelefono" type="text" placeholder="111-111-1111"
                                   class="mb-4 w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200" required>
                        </div>
                    </div>
                </div>
            </form>

        </div>

        <div class="pb-8 pt-6 px-8 rounded-lg bg-white shadow-md shadow-violet-500/50 h-auto mx-56 mt-2 mb-6 dark:bg-zinc-900">

            <h2 class="text-gray-700 text-xl text-center leading-relaxed dark:text-gray-400">Datos de Usuario</h2>

            <div class="grid grid-cols-2 border-t-2 border-violet-300 py-4">

                <div class="px-4">
                    <label class="mt-4 text-gray-700 text-lg leading-relaxed m-5 dark:text-gray-400">Nombre de Usuario: </label> 
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 pb-4 flex items-center pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 20h14M12 4a4 4 0 110 8 4 4 0 010-8zm0 8c-4 0-8 2-8 4v2h16v-2c0-2-4-4-8-4z" />
                            </svg>
                        </span>
                        <input id="txtUsuario" type="text" placeholder="Ej. Empleado_1"
                               class=" mb-4 w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200" required>
                    </div>
                </div>

                <div class="pt-4">
                    <a class="mt-4 text-gray-700 text-lg leading-relaxed m-5 dark:text-gray-400">Categoria:</a>
                    <form class="px-8 ">

                        <select id="cmbCategoria" class="bg-white w-full my-auto h-8 border border-gray-300 rounded-full shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200 pl-8">

                        </select>
                    </form>
                </div>
                <--<!-- le voy agregar lo de que seleccione a que sucursal va a pertenecer -->
                <div class="pt-4">
                    <a class="mt-4 text-gray-700 text-lg leading-relaxed m-5 dark:text-gray-400">Sucursal a la que pertenece:</a>
                    <form class="px-8 ">

                        <select id="cmbSucursal" class="bg-white w-full my-auto h-8 border border-gray-300 rounded-full shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200 pl-8">

                        </select>
                    </form>
                </div>
                <div class="px-4">
                    <label class="mt-4 text-gray-700 text-lg leading-relaxed m-5 dark:text-gray-400">Contraseña: </label> 
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 pb-4 flex items-center pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c1.657 0 3 1.343 3 3v3H9v-3c0-1.657 1.343-3 3-3z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8V7a5 5 0 00-10 0v1" />
                            <rect width="14" height="10" x="5" y="11" rx="2" ry="2" stroke-width="2" stroke="currentColor" fill="none" />
                            </svg>
                        </span>
                        <input id="txtContrasena" type="password" placeholder="contraseña..."
                               class=" mb-4 w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200" required>
                    </div>
                </div>
                <div>
                    <label class="mt-4 text-gray-700 text-lg leading-relaxed m-5 dark:text-gray-400">Repetir contraseña: </label> 
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 pb-4 flex items-center pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c1.657 0 3 1.343 3 3v3H9v-3c0-1.657 1.343-3 3-3z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8V7a5 5 0 00-10 0v1" />
                            <rect width="14" height="10" x="5" y="11" rx="2" ry="2" stroke-width="2" stroke="currentColor" fill="none" />
                            </svg>
                        </span>
                        <input id="txtRola" type="password" placeholder="contraseña..."
                               class=" mb-4 w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200" required>
                    </div>
                </div>

                <button id="registrarU" class="mx-auto bg-gradient-to-r w-1/2 from-purple-600 via-purple-700 to-purple-800 hover:from-purple-700 hover:via-purple-800 hover:to-purple-900 text-white font-bold py-3 px-6 rounded-full shadow-md hover:shadow-lg transition-all duration-200 ease-in-out mt-6">Registrar</button>
                <button id="mostrarU" class="mx-auto bg-gradient-to-r w-1/2 from-yellow-600 via-yellow-700 to-yellow-800 hover:from-yellow-700 hover:via-yellow-800 hover:to-yellow-900 text-white font-bold py-3 px-6 rounded-full shadow-md hover:shadow-lg transition-all duration-200 ease-in-out mt-6">Mostrar Usuarios</button>
            </div> 
        </div>
    </body>
</html>
