                            <th class="bg-gradient-to-r from-purple-700 to-purple-600 border-r border-purple-300 border-b-2 border-stone-200 w-32 h-12 p-2 pl-4 text-white text-left">Usuario</th>

                                       class="  mb-4 w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200" required>

                            </div>

                            <div class="px-4">
                                <label class="text-gray-700 text-lg leading-relaxed m-5 dark:text-gray-400">Apellido paterno: </label> 
                                <input id="txtApellidoP" type="text" placeholder="Ejem: Martinez"
                                       class="mb-4 w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200" required>
                            </div>

                            <div class="px-4">
                                <label class="text-gray-700 text-lg leading-relaxed m-5 dark:text-gray-400">Apellido Materno: </label>

                                       class="mb-4 w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200" required>

                            </div>
                            <div class="px-4">
                                <label class="text-gray-700 text-lg leading-relaxed m-5 dark:text-gray-400">Correo: </label> 
                                <input id="txtCorreo" type="text" placeholder="Ejem: ejemplo123@gmail.com"
                                       class="mb-4 w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200" required>
                            </div>
                            <div class="px-4">
                                <label class="text-gray-700 text-lg leading-relaxed m-5 dark:text-gray-400">Telefono: </label> 
                                <input id="txtTelefono" type="text" placeholder="Ejem: 000-000-0000"
                                       class="mb-4 w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200" required>
