<!DOCTYPE html>
<html>
    <head>
        <title>Admin - Inicio</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    </head>
    <body>
        <!-- Contenedor principal -->
        <div id="divCatalogo" class="bg-gradient-to-br from-gray-200 via-white to-purple-400 backdrop-blur-sm">
            <div class="container mx-auto p-4">
                <h1 class="text-3xl font-bold text-black-700 mb-4 underline underline-offset-8 decoration-purple-600">Productos disponibles</h1>

                <!-- Filtro por categoría -->
                <div class="mb-6 flex flex-wrap items-center gap-4">
                    <label for="categoriaFiltro" class="block mb-2 text-sm font-medium text-gray-700"></label>
                    <select id="categoriaFiltro" onchange="filtrarPorCategoria()" class="w-60 p-2 border border-gray-300 rounded-md shadow-sm">
                        <option value="0">Todas</option>
                        <!-- Las opciones se llenarán dinámicamente -->
                    </select>

                    <!-- este boton va a ser para crear un nuevo producto -->
                    <button id="btnNew" class="bg-purple-700 hover:bg-purple-800 text-white px-4 py-2 rounded-lg shadow transition">
                        +
                    </button>

                    <!-- este boton es para generar reportes -->
                    <button id="btnReporte" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg shadow transition">
                        📄
                    </button>
                </div>

                <!-- Grid de productos -->
                <div id="productosContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Aquí se insertarán los productos como cards -->
                </div>
            </div>
        </div>
        <div id="divDetalle" class="min-h-screen py-10 px-4 bg-gradient-to-br from-gray-200 via-white to-purple-400 backdrop-blur-sm border-4 border-black">
            <div class="max-w-4xl mx-auto bg-white/70 rounded-2xl shadow-2xl p-6 backdrop-blur-md">
                <div class="flex flex-col md:flex-row gap-8">

                    <!-- Imagen del producto -->
                    <div class="w-full md:w-1/2 p-5 rounded-xl shadow-inner flex flex-col items-center bg-white/80 backdrop-blur">
                        <div class="w-full aspect-square rounded-xl border-2 border-dashed border-gray-300 flex items-center justify-center overflow-hidden mb-4 bg-white">
                            <img id="imgFoto" alt="Imagen del producto" class="max-h-full object-contain transition duration-200" />
                        </div>

                        <label for="inputFoto" class="cursor-pointer flex items-center gap-2 bg-purple-900 hover:bg-purple-950 text-white px-4 py-2 text-sm rounded-md shadow transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M12 12v6m0 0l-3-3m3 3l3-3m6-9h-4l-2-2H10L8 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V7a2 2 0 00-2-2z" />
                            </svg>
                            Cargar Imagen
                        </label>
                        <input type="file" id="inputFoto" class="hidden" accept="image/*" />
                        <textarea id="txtaFoto" class="hidden"></textarea>
                    </div>

                    <!-- Formulario -->
                    <div class="w-full md:w-1/2 space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">ID:</label>
                            <input id="txtIdProducto" type="text" readonly
                                   class="w-full mt-1 px-3 py-2 border rounded-lg bg-gray-100 text-gray-800 shadow-sm ring-1 ring-offset-2 ring-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300" />

                            <label class="block mt-4 text-sm font-medium text-gray-700">Nombre:</label>
                            <input id="txtNombreProducto" type="text"
                                   class="w-full mt-1 px-3 py-2 border rounded-lg ring-1 ring-offset-2 ring-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300 shadow-sm" />

                            <label class="block mt-4 text-sm font-medium text-gray-700">Categoría:</label>
                            <select id="categoriaDetalle"
                                    class="w-full mt-1 px-3 py-2 border rounded-lg bg-white text-gray-700 ring-1 ring-offset-2 ring-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300 shadow-sm">
                                <!-- JS Opciones -->
                            </select>

                            <label class="block mt-4 text-sm font-medium text-gray-700">Descripción:</label>
                            <textarea id="txtDescripcion" rows="3"
                                      class="w-full mt-1 px-3 py-2 border rounded-lg ring-1 ring-offset-2 ring-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300 shadow-sm resize-none"></textarea>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700">Precio:</label>
                            <input id="txtPrecio" type="number" step="0.01"
                                   class="w-full mt-1 px-3 py-2 border rounded-lg ring-1 ring-offset-2 ring-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300 shadow-sm" />

                            <label class="block mt-4 text-sm font-medium text-gray-700">Código Interno:</label>
                            <input id="txtCodigoInterno" type="text"
                                   class="w-full mt-1 px-3 py-2 border rounded-lg ring-1 ring-offset-2 ring-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-300 shadow-sm" />
                            <hr class="my-6 border-t-2 border-purple-400">

                            <h2 class="text-xl font-bold text-gray-800 mb-4">Detalles por talla y color</h2>
                            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Talla:</label>
                                    <select id="selectTalla" class="w-full px-3 py-2 border rounded-lg shadow-sm ring-1 ring-gray-300">
                                        <!-- Opciones se llenan dinámicamente -->
                                    </select>
                                </div>
                                
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Color:</label>
                                    <select id="selectColor" class="w-full px-3 py-2 border rounded-lg shadow-sm ring-1 ring-gray-300">
                                        <!-- Opciones se llenan dinámicamente -->
                                    </select>
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Stock:</label>
                                    <input id="inputStockDetalle" type="number" min="0" class="w-full px-3 py-2 border rounded-lg shadow-sm ring-1 ring-gray-300" />
                                </div>
                                <!-- DIV PARA UNIDAD DE MEDIDA -->
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Unidad:</label>
                                    <select id="selectUnidad" class="w-full px-3 py-2 border rounded-lg shadow-sm ring-1 ring-gray-300">
                                        <!-- Opciones se llenan dinámicamente -->
                                    </select>
                                </div>
                                <div>
                                    <button id="btnAgregarDetalle" type="button" class="bg-purple-700 hover:bg-purple-800 text-white w-full py-2 rounded-lg shadow transition">+</button>
                                </div>
                            </div>

                            <!-- Tabla para mostrar los detalles -->
                            <div class="mt-6">
                                <table class="w-full table-auto bg-white border border-gray-300 rounded-lg shadow-sm text-sm text-left">
                                    <thead class="bg-purple-100 text-purple-900">
                                        <tr>
                                            <th class="px-4 py-2 border">Talla</th>
                                            <th class="px-4 py-2 border">Color</th>
                                            <th class="px-4 py-2 border">Stock</th>
                                            <th class="px-4 py-2 border">Unidad</th>
                                            <th class="px-4 py-2 border">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tablaDetalles">
                                        <!-- Aquí se mostrarán dinámicamente los registros del array -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Botones -->
                <div class="flex flex-wrap justify-end gap-3 mt-8">
                    <button id="btnSave"
                            class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-lg shadow transition font-semibold">Guardar</button>
                    <button id="btnEliminar" onclick="eliminarProducto();"
                            class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-lg shadow transition font-semibold">Eliminar</button>
                    <button id="btnRegresar"
                            class="bg-gray-600 hover:bg-gray-700 text-white px-5 py-2 rounded-lg shadow transition font-semibold">Regresar</button>
                    <button id="btnLimpiar"
                            class="bg-gray-600 hover:bg-gray-700 text-white px-5 py-2 rounded-lg shadow transition font-semibold">Limpiar</button>
                </div>
            </div>
        </div>
        <script src="js/inicio.js" type="text/javascript"></script>
    </body>
</html>
